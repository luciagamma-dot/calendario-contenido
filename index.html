<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calendario de contenido</title>
<style>
:root {
  --bg: #f5f4f0; --fg: #1c1c1a; --muted: #6b6963; --card: #ffffff; --line: #e2e0d9;
  --ig: #d62976; --tt: #111111; --yt: #e00000; --tw: #7c3aed; --sel: #1c1c1a; --selfg: #ffffff;
  --today: #fde68a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151514; --fg: #f1f0ec; --muted: #a3a197; --card: #1f1f1c; --line: #33332e;
    --ig: #ff6fa5; --tt: #f1f0ec; --yt: #ff7a7a; --tw: #c4b5fd; --sel: #f1f0ec; --selfg: #151514;
    --today: #6b5a1e;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: 20px max(14px, env(safe-area-inset-right, 0px)) 48px max(14px, env(safe-area-inset-left, 0px));
}
main { max-width: 1200px; margin: 0 auto; }
.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.layout .card { padding: 16px; }
@media (min-width: 861px) {
  .day { position: sticky; top: 16px; margin-top: 0; max-height: calc(100vh - 32px); overflow-y: auto; }
}
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.intro { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.head strong { text-transform: capitalize; font-size: 16px; }
.head button {
  font: inherit; color: var(--fg); background: transparent; border: 0; border-radius: 8px;
  width: 36px; height: 36px; cursor: pointer; font-size: 20px;
}
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dow span { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; padding: 4px 0; }
.cell {
  appearance: none; border: 0; background: transparent; color: var(--fg); font: inherit;
  height: 84px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 8px;
  border-radius: 10px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.cell.out { color: var(--muted); opacity: 0.45; }
.cell.today .num { box-shadow: inset 0 0 0 2px var(--fg); }
.cell.sel { background: var(--sel); color: var(--selfg); }
.cell.sel .num { box-shadow: none; }
.num {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 16px;
}
.dots { display: flex; gap: 4px; min-height: 9px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.rec { background: transparent; border: 1.5px solid currentColor; }
.plat-instagram { background: var(--ig); }
.plat-tiktok { background: var(--tt); }
.plat-youtube { background: var(--yt); }
.plat-twitch { background: var(--tw); }
.plat-instagram.rec { background: transparent; border-color: var(--ig); }
.plat-tiktok.rec { background: transparent; border-color: var(--tt); }
.plat-youtube.rec { background: transparent; border-color: var(--yt); }
.plat-twitch.rec { background: transparent; border-color: var(--tw); }
.legend { font-size: 12px; color: var(--muted); margin: 10px 2px 0; display: flex; gap: 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.day { margin-top: 14px; }
.day h2 { font-size: 16px; margin: 0 0 8px; text-transform: capitalize; }
.task {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; margin-bottom: 8px; border-left: 4px solid var(--accent);
}
.task .top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.task .tag {
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px;
  color: var(--fg); background: var(--line); border-radius: 6px; padding: 1px 6px;
}
.task .t { font-size: 14px; margin: 4px 0 2px; text-wrap: balance; }
.task .s { font-size: 12px; color: var(--muted); }
.task.done { opacity: 0.55; }
.task.done .t { text-decoration: line-through; }
.task.done .tag::after { content: " · Hecho ✓"; }
.dot.done { opacity: 0.35; }
.none { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.guion-btn {
  font: inherit; font-size: 12px; font-weight: 600; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; margin-top: 6px; cursor: pointer;
}
.guion {
  white-space: pre-wrap; font-size: 13px; line-height: 1.5; background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 8px; font-family: inherit;
}
.guion[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Calendario de contenido</h1>
  <p class="intro" id="intro">Cargando…</p>

  <div class="layout">
  <section class="card" aria-label="Calendario">
    <div class="head">
      <button id="prev" aria-label="Mes anterior">‹</button>
      <strong id="label"></strong>
      <button id="next" aria-label="Mes siguiente">›</button>
    </div>
    <div class="dow"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="dot plat-instagram"></i>Instagram</span>
      <span><i class="dot plat-tiktok"></i>TikTok</span>
      <span><i class="dot plat-youtube"></i>YouTube</span>
      <span><i class="dot plat-twitch"></i>Twitch</span>
      <span><i class="dot rec" style="color:var(--muted)"></i>Grabar (hueco) · Publicar (lleno)</span>
    </div>
  </section>

  <section class="card day" id="day" aria-live="polite"></section>
  </div>
</main>
<script>
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const PNAME = { instagram: "Instagram", tiktok: "TikTok", youtube: "YouTube", twitch: "Twitch" };
const PCOLOR = { instagram: "var(--ig)", tiktok: "var(--tt)", youtube: "var(--yt)", twitch: "var(--tw)" };
let TASKS = [];
let PLAT = [];
let view = { y: 2026, m: 10 };
let selected = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const iso = (y, m, d) => y + "-" + pad(m + 1) + "-" + pad(d);
const todayIso = () => { const n = new Date(); return iso(n.getFullYear(), n.getMonth(), n.getDate()); };

function shift(delta) {
  let m = view.m + delta, y = view.y;
  while (m < 0) { m += 12; y--; }
  while (m > 11) { m -= 12; y++; }
  view = { y, m };
  renderGrid();
}

function renderGrid() {
  document.getElementById("label").textContent = MONTHS[view.m] + " " + view.y;
  const first = new Date(view.y, view.m, 1);
  const offset = (first.getDay() + 6) % 7;
  const days = new Date(view.y, view.m + 1, 0).getDate();
  const prevDays = new Date(view.y, view.m, 0).getDate();
  const today = todayIso();
  let html = "";
  const total = Math.ceil((offset + days) / 7) * 7;
  for (let i = 0; i < total; i++) {
    let y = view.y, m = view.m, d;
    let out = false;
    if (i < offset) { d = prevDays - offset + 1 + i; m = view.m - 1; out = true; }
    else if (i >= offset + days) { d = i - offset - days + 1; m = view.m + 1; out = true; }
    else d = i - offset + 1;
    if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
    const key = iso(y, m, d);
    const dayTasks = TASKS.filter((t) => t.fecha === key);
    const dots = dayTasks.slice(0, 6).map((t) =>
      `<i class="dot plat-${t.plataforma}${t.tipo === "Grabar" ? " rec" : ""}${t.hecho ? " done" : ""}"></i>`).join("");
    html += `<button class="cell${out ? " out" : ""}${key === selected ? " sel" : ""}" data-date="${key}" aria-label="${d} ${MONTHS[m]}, ${dayTasks.length} tareas">
      <span class="num"${key === today ? ' style="font-weight:700"' : ""}>${d}</span>
      <span class="dots">${dots}</span>
    </button>`;
  }
  document.getElementById("grid").innerHTML = html;
}

function renderDay() {
  const box = document.getElementById("day");
  if (!selected) { box.innerHTML = '<p class="none">Toca un día para ver sus tareas.</p>'; return; }
  const [y, m, d] = selected.split("-").map(Number);
  const title = new Date(y, m - 1, d, 12).toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
  const list = TASKS.filter((t) => t.fecha === selected)
    .sort((a, b) => (a.tipo === b.tipo ? a.plataforma.localeCompare(b.plataforma) : a.tipo === "Grabar" ? -1 : 1));
  const body = list.length
    ? list.map((t) => `
      <article class="task${t.hecho ? " done" : ""}" style="--accent:${PCOLOR[t.plataforma]}">
        <div class="top"><span class="tag">${esc(t.tipo)}</span><span>${esc(PNAME[t.plataforma] || t.plataforma)}</span><span>· ${esc(t.formato)}</span></div>
        <div class="t">${esc(t.titulo)}</div>
        <div class="s">${esc(t.estado)}</div>
        ${t.guion ? `<button class="guion-btn" data-guion="${esc(t.guion)}">Ver guion</button><div class="guion" hidden></div>` : ""}
      </article>`).join("")
    : '<p class="none">No hay tareas este día.</p>';
  box.innerHTML = `<h2>${esc(title)}</h2>${body}`;
}

document.getElementById("day").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-guion]");
  if (!btn) return;
  const box = btn.parentElement.querySelector(".guion");
  if (!box.hidden) { box.hidden = true; btn.textContent = "Ver guion"; return; }
  btn.textContent = "Ocultar guion";
  if (!box.textContent) {
    box.textContent = "Cargando guion…";
    box.hidden = false;
    try {
      const r = await fetch("guiones/" + btn.dataset.guion + ".txt?v=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      box.textContent = await r.text();
    } catch (err) {
      box.textContent = "No se pudo cargar el guion.";
    }
  }
  box.hidden = false;
});

document.getElementById("prev").addEventListener("click", () => shift(-1));
document.getElementById("next").addEventListener("click", () => shift(1));
document.getElementById("grid").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-date]");
  if (!b) return;
  selected = b.dataset.date;
  renderGrid();
  renderDay();
});

fetch("data.json?v=" + Date.now(), { cache: "no-store" })
  .then((r) => r.json())
  .then((d) => {
    TASKS = d.tareas || [];
    PLAT = d.plataformas || [];
    const dates = TASKS.map((t) => t.fecha).sort();
    if (dates.length) {
      const [yy, mm] = dates[0].split("-").map(Number);
      view = { y: yy, m: mm - 1 };
    }
    document.getElementById("intro").textContent =
      "Actualizado el " + new Date(d.actualizado + "T12:00:00").toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" }) + ".";
    renderGrid();
    renderDay();
  })
  .catch(() => {
    document.getElementById("intro").textContent = "No se pudo cargar el calendario. Vuelve a intentarlo.";
  });
</script>
</body>
</html>
